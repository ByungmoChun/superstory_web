<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperStory — 슈퍼스토리</title>
<meta name="description" content="원작을 설계하는 트랜스미디어 IP 홀더 컴퍼니. 오리지널 슈퍼 IP, 플레이툰 · 플레이북, PlayToon Maker — 슈퍼스토리 공식 홈페이지">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="canonical" href="https://superstory.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SuperStory">
<meta property="og:title" content="SuperStory — 슈퍼스토리">
<meta property="og:description" content="원작을 설계하는 트랜스미디어 IP 홀더 컴퍼니. 흥행은 변수여도, 플레이툰 수익은 상수입니다.">
<meta property="og:image" content="https://superstory.com/og.png">
<meta property="og:url" content="https://superstory.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
<title>SUPERSTORY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;600&family=Nanum+Myeongjo:wght@700;800&family=Noto+Serif+JP:wght@700;900&display=swap">
<style>
:root{
  --ink:#08080a; --ground:#0c0c10; --surface:#131318; --raised:#1a1a21;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.17);
  --brand:#d01027; --brand-lit:#f0263f; --ember:#e9b458;
  --ok:#1d9e75; --gold:#facc15; --lav:#a99de4; --maroon:#6b1f1f; --coral:#fb923c;
  --fg:#f4f2f0; --fg-2:#c6c2c9; --mute:#8b8792;
  --serif:"Bodoni Moda",Georgia,serif;
  --myeong:"Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --myeong-jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Pretendard Variable",Pretendard,"Apple SD Gothic Neo",ui-monospace,monospace;
  --rail:1180px; --nav-h:68px;
}
*{box-sizing:border-box}
html{background:var(--ink);scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-weight:300;
  font-size:15px;line-height:1.76;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-lit);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.rail{width:100%;max-width:var(--rail);margin:0 auto;padding-inline:22px}
.mono{font-family:var(--mono)}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:80;background:rgba(8,8,10,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:16px;height:var(--nav-h)}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:30px;width:auto}
@media(max-width:1060px){.brand img{height:26px}}
.menu{display:flex;margin-left:auto;height:var(--nav-h)}
.mi{position:relative;display:flex;align-items:center}
.mi>a{display:flex;align-items:center;height:100%;padding:0 13px;font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2);transition:color .18s;white-space:nowrap}
.mi:hover>a,.mi.on>a{color:var(--fg)}
.mi.on>a{box-shadow:inset 0 -2px 0 var(--brand)}
.sub{position:absolute;top:var(--nav-h);left:0;min-width:208px;background:var(--surface);
  border:1px solid var(--line);padding:7px 0;opacity:0;visibility:hidden;transform:translateY(-5px);
  transition:.16s;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.mi:hover .sub,.mi:focus-within .sub{opacity:1;visibility:visible;transform:none}
.sub a{display:block;padding:7px 16px;font-size:13px;color:var(--fg-2);transition:.15s}
.sub a:hover{background:var(--raised);color:var(--fg)}
.lang{display:flex;flex:none;border:1px solid var(--line-2);overflow:hidden;margin-left:4px}
.lang button{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;background:none;border:0;
  color:var(--fg-2);padding:6px 9px;cursor:pointer;transition:.16s}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
.burger{display:none;flex:none;background:none;border:1px solid var(--line-2);width:34px;height:30px;
  cursor:pointer;align-items:center;justify-content:center}
.burger span{display:block;width:15px;height:1px;background:var(--fg);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:15px;height:1px;background:var(--fg)}
.burger span::before{top:-5px}.burger span::after{top:5px}
.drawer{display:none;border-top:1px solid var(--line);background:var(--ground);max-height:72vh;overflow-y:auto}
.drawer.open{display:block}
.drawer .d1{display:block;padding:13px 22px;font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;border-bottom:1px solid var(--line)}
.drawer .d2{display:block;padding:9px 22px 9px 38px;font-size:13.5px;color:var(--fg-2);
  border-bottom:1px solid var(--line)}
@media(max-width:1060px){
  .menu{display:none}.burger{display:flex}
  .nav-in{gap:10px}.lang{margin-left:auto}
}

/* ============ PAGE HEAD ============ */
.ph{padding-block:54px 34px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:-60% -20% auto -20%;height:180%;
  background:radial-gradient(50% 44% at 22% 0%,rgba(208,16,39,.22),transparent 68%);pointer-events:none}
.ph-in{position:relative;z-index:2}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-lit)}
.ph h1{font-family:var(--myeong);font-weight:800;font-size:clamp(26px,4.2vw,40px);line-height:1.3;
  letter-spacing:-.025em;margin:14px 0 0;text-wrap:balance}
:root[data-lang="en"] .ph h1{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.16}
:root[data-lang="ja"] .ph h1,:root[data-lang="ja"] .sh h2,:root[data-lang="ja"] .lead-q,:root[data-lang="ja"] .ip-title h3,:root[data-lang="ja"] .d-title h1,:root[data-lang="ja"] .d-log{font-family:var(--myeong-jp);font-weight:900;letter-spacing:0}
:root[data-lang="ja"] .d-log{font-weight:700}
.ph p{color:var(--fg-2);margin:14px 0 0;max-width:66ch;font-size:15px}

/* ============ SECTION ============ */
.sec{padding-block:58px;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sh{margin-bottom:34px;max-width:72ch}
.sh .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sh .eyebrow::before{content:"";width:20px;height:1px;background:var(--brand);flex:none}
.sh h2{font-family:var(--myeong);font-weight:800;font-size:clamp(21px,3vw,30px);line-height:1.36;
  margin:13px 0 0;letter-spacing:-.025em;text-wrap:balance}
:root[data-lang="en"] .sh h2{font-family:var(--serif);font-weight:600;letter-spacing:-.015em}
.sh p{color:var(--fg-2);margin:12px 0 0;font-size:14.5px}

/* ============ GENERIC ============ */
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.cell{background:var(--ground);padding:26px 24px}
@media(max-width:880px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.num{font-family:var(--mono);font-size:11px;color:var(--brand-lit);letter-spacing:.13em}
.cell h3{font-size:17px;font-weight:600;margin:11px 0 8px;letter-spacing:-.01em}
.cell p{margin:0;color:var(--mute);font-size:13.5px}
.stat b{display:block;font-family:var(--mono);font-weight:600;font-size:30px;letter-spacing:-.03em;
  color:var(--ember);font-variant-numeric:tabular-nums;line-height:1.1}
.stat strong{display:block;font-size:13.5px;font-weight:600;margin-top:8px}
.stat span{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
.note{font-size:11.5px;color:var(--mute);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{font-size:12.5px;border:1px solid var(--line-2);padding:4px 10px;color:var(--fg-2)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-2);padding:3px 7px;color:var(--fg-2);white-space:nowrap}
.tag.st-live{border-color:transparent;background:rgba(29,158,117,.15);color:var(--ok)}
.tag.st-dev{border-color:transparent;background:rgba(250,204,21,.14);color:var(--gold)}
.tag.st-post,.tag.st-lav{border-color:transparent;background:rgba(169,157,228,.16);color:var(--lav)}
.tag.new{border-color:transparent;background:rgba(233,180,88,.15);color:var(--ember)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand);background:var(--brand);
  color:#fff;padding:11px 20px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.18s}
.btn:hover{background:#b00d21;border-color:#b00d21}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--fg);background:rgba(255,255,255,.05)}
.shot{border:1px solid var(--line);background:var(--surface);padding:10px}
.shot img{width:100%;height:auto}
.shot figcaption{font-size:11.5px;color:var(--mute);padding:9px 3px 2px;font-family:var(--mono);letter-spacing:.03em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr;gap:24px}}
.colh{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand-lit);margin:0 0 20px;padding-bottom:11px;border-bottom:1px solid var(--line-2)}
.lead-q{font-family:var(--myeong);font-weight:700;font-size:clamp(20px,3vw,29px);line-height:1.52;
  margin:0 0 34px;letter-spacing:-.02em;max-width:28ch}
:root[data-lang="en"] .lead-q{font-family:var(--serif);font-weight:500}
.lead-q em{font-style:normal;color:var(--ember)}

/* ============ IP LIST ============ */
.filters{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding-bottom:22px;
  border-bottom:1px solid var(--line);margin-bottom:26px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup label{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{background:none;border:1px solid var(--line-2);color:var(--mute);padding:5px 11px;
  font-size:12.5px;cursor:pointer;transition:.16s}
.fchips button:hover{color:var(--fg)}
.fchips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink);font-weight:500}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);padding:7px 12px;
  min-width:200px}
.search input{background:none;border:0;outline:none;font-size:13.5px;width:100%}
.search input::placeholder{color:var(--mute)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-bottom:14px}
.ips{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.ip{background:var(--ground);display:grid;grid-template-columns:1.35fr .9fr;position:relative;overflow:hidden;
  min-height:250px;transition:background .2s}
.ip:hover{background:var(--surface)}
.ip-body{padding:28px 28px 30px;position:relative;z-index:2}
.ip-tags{display:flex;flex-wrap:wrap;gap:6px}
.ip-title{margin:15px 0 0;min-height:66px;display:flex;align-items:center}
.ip-title img{max-height:66px;max-width:280px;width:auto;height:auto;object-fit:contain}
.ip-title h3{font-family:var(--myeong);font-weight:800;font-size:25px;margin:0;letter-spacing:-.02em}
.ip-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute);margin-top:9px;
  text-transform:uppercase}
.ip-log{margin:11px 0 0;color:var(--fg-2);font-size:14px;max-width:46ch}
.ip-foot{margin-top:16px;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.ip-foot .more{color:var(--brand-lit);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.ip-art{position:relative}
.ip-art img{position:absolute;right:0;bottom:0;height:100%;width:100%;object-fit:contain;
  object-position:right bottom;filter:drop-shadow(0 12px 34px rgba(0,0,0,.6))}
.ip::after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,var(--ground) 0%,rgba(12,12,16,.5) 34%,transparent 62%)}
.ip:hover::after{background:linear-gradient(90deg,var(--surface) 0%,rgba(19,19,24,.5) 34%,transparent 62%)}
@media(max-width:820px){
  .ip{grid-template-columns:1fr;min-height:0}
  .ip-art{height:200px;order:-1}
  .ip-art img{position:relative;height:200px;object-position:center bottom}
  .ip::after{display:none}.ip-log{max-width:none}
}
.empty{border:1px dashed var(--line-2);padding:40px;text-align:center;color:var(--mute);font-size:14px}

/* ============ IP DETAIL ============ */
.d-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:end;padding-block:48px 34px;
  border-bottom:1px solid var(--line);position:relative}
@media(max-width:860px){.d-hero{grid-template-columns:1fr;align-items:start}}
.d-hero .art{height:300px;position:relative}
.d-hero .art img{position:absolute;right:0;bottom:0;height:100%;width:100%;object-fit:contain;object-position:right bottom;
  filter:drop-shadow(0 14px 40px rgba(0,0,0,.65))}
@media(max-width:860px){.d-hero .art{height:230px}.d-hero .art img{object-position:center bottom}}
.d-title{min-height:80px;display:flex;align-items:center;margin:16px 0 0}
.d-title img{max-height:80px;max-width:320px;width:auto;height:auto;object-fit:contain}
.d-title h1{font-family:var(--myeong);font-weight:800;font-size:34px;margin:0;letter-spacing:-.025em}
.d-log{font-family:var(--myeong);font-size:17px;color:var(--fg);margin:16px 0 0;line-height:1.7;max-width:44ch}
:root[data-lang="en"] .d-log{font-family:var(--serif);font-style:italic}
.dl{display:grid;grid-template-columns:120px 1fr;gap:10px 18px;margin:0;font-size:13.5px}
.dl dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-lit);
  padding-top:3px}
.dl dd{margin:0;color:var(--fg-2)}
@media(max-width:520px){.dl{grid-template-columns:1fr;gap:3px 0}.dl dd{margin-bottom:9px}}
.ph-slot{border:1px dashed var(--line-2);padding:26px;color:var(--mute);font-size:13.5px}
.ph-slot b{display:block;color:var(--fg-2);font-weight:600;font-size:14px;margin-bottom:6px}
.prev-next{display:flex;justify-content:space-between;gap:14px;padding-block:28px;flex-wrap:wrap}
.prev-next a{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--mute)}
.prev-next a:hover{color:var(--fg)}

/* ============ LEGAL ============ */
.legal{max-width:78ch}
.legal section{padding-block:26px;border-top:1px solid var(--line)}
.legal section:first-child{border-top:0;padding-top:0}
.legal h3{font-size:16.5px;font-weight:600;margin:0 0 13px;letter-spacing:-.01em;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.legal h3 span{font-family:var(--mono);font-size:10.5px;color:var(--brand-lit);letter-spacing:.12em;flex:none}
.legal p{margin:0 0 10px;color:var(--fg-2);font-size:14px}
.legal p:last-child{margin-bottom:0}
.legal ol,.legal ul{margin:10px 0 0;padding-left:19px;color:var(--mute);font-size:13.5px;display:grid;gap:9px}
.legal li b{color:var(--fg-2);font-weight:600}
.ltab{margin-top:13px;border:1px solid var(--line);background:var(--ground)}
.ltab div{display:grid;grid-template-columns:minmax(150px,1fr) 1.5fr;gap:16px;padding:11px 16px;
  border-top:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.ltab div:first-child{border-top:0;background:var(--surface);font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.ltab b{color:var(--brand-lit);font-weight:400;font-family:var(--mono);font-size:10.5px}
@media(max-width:560px){.ltab div{grid-template-columns:1fr;gap:4px}}
.notice{border:1px solid var(--line-2);background:var(--surface);padding:16px 18px;font-size:13.5px;
  color:var(--fg-2);margin-bottom:30px}

/* ============ MAP ============ */
.mapbox{position:relative;width:100%;aspect-ratio:21/9;border:1px solid var(--line);background:var(--surface);
  overflow:hidden}
@media(max-width:860px){.mapbox{aspect-ratio:4/3}}
.mapbox iframe{position:absolute;inset:0;z-index:2;width:100%;height:100%;border:0;display:block}
.map-fb{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:26px;
  background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--ground) 10px 20px)}
.map-fb b{font-size:15px;font-weight:600;color:var(--fg)}
.map-fb span{font-size:13px;color:var(--mute);max-width:46ch}
.map-fb .mono{font-size:11.5px;letter-spacing:.04em;color:var(--fg-2);border:1px solid var(--line-2);
  padding:6px 12px;margin-top:4px}
.mapbox.blocked iframe{display:none}
.mapbox.blocked .map-fb{display:flex}
.map-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* ============ CI / BI ============ */
.logo-board{display:grid;grid-template-columns:1.4fr 1.4fr .9fr;gap:14px}
@media(max-width:820px){.logo-board{grid-template-columns:1fr}}
.lb{border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:40px 28px;min-height:190px;position:relative}
.lb img{max-width:260px;width:100%;height:auto}
.lb.sym img{max-width:76px}
.lb span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lb.light{background:#fff}
.lb.light span{color:#8b8792}
.lb.dark{background:var(--ink)}
.lb.sym{background:var(--surface)}
.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:760px){.sws{grid-template-columns:repeat(2,1fr)}}
.sw{background:var(--ground);padding:0 0 18px}
.sw>span{display:block;height:90px;margin-bottom:16px}
.sw b,.sw em,.sw i{display:block;padding-inline:18px}
.sw b{font-size:14.5px;font-weight:600}
.sw em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ember);letter-spacing:.06em;margin-top:4px}
.sw i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:5px;letter-spacing:.03em}
.filelist{margin:0;padding:0;list-style:none;border:1px solid var(--line);background:var(--ground)}
.filelist li{display:grid;grid-template-columns:minmax(180px,1fr) 58px 2fr;gap:16px;align-items:baseline;
  padding:16px 20px;border-top:1px solid var(--line)}
.filelist li:first-child{border-top:0}
.filelist .fn{font-family:var(--mono);font-size:12.5px;color:var(--fg);word-break:break-all}
.filelist .ff{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--brand-lit);
  border:1px solid var(--line-2);padding:2px 0;text-align:center}
.filelist .fd{font-size:13px;color:var(--mute)}
@media(max-width:700px){.filelist li{grid-template-columns:1fr auto;gap:6px 12px}
  .filelist .fd{grid-column:1 / -1}}

/* ============ PROCESS ============ */
.proc{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:18px}
.step{flex:1 1 0;min-width:148px;border:1px solid var(--line);background:var(--surface);padding:14px}
.step b{display:block;font-family:var(--mono);font-size:10px;color:var(--brand-lit);letter-spacing:.14em;margin-bottom:7px}
.lane-h{font-family:var(--sans);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0 0 4px;color:var(--fg)}
.lane-h.ours{color:var(--brand-lit)}
/* 한글·일문 라벨: 모노 자간을 줄이고 굵기를 올린다 (라틴 대문자 전용 트래킹을 CJK에 적용하지 않음) */
:root:not([data-lang="en"]) :is(.colh,.dl dt,.foot h4,.fgroup label,.field label,.tlh .tlc,.lb span,.news .kind,.legal h3 span,.hyear-k em,.ltab div:first-child span){letter-spacing:.06em;font-weight:600}
.step span{font-size:12.5px;color:var(--fg-2);line-height:1.55}

/* ============ HISTORY ============ */
.hist-wrap{display:grid;gap:0}
.hyear{display:grid;grid-template-columns:168px 1fr;gap:0;border-top:1px solid var(--line);padding-block:30px}
.hyear:first-child{border-top:0;padding-top:0}
.hyear-k{position:sticky;top:calc(var(--nav-h) + 18px);align-self:start;display:flex;align-items:baseline;gap:10px}
.hyear-k span{font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums}
.hyear-k em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--mute)}
.hyear-k em::before{content:"";display:inline-block;width:14px;height:1px;background:var(--brand);
  vertical-align:middle;margin-right:7px}
.hlist{margin:0;padding:0;list-style:none;display:grid;border-left:1px solid var(--line-2)}
.hlist li{display:grid;grid-template-columns:62px 1fr;gap:0 4px;position:relative;padding:9px 0 9px 24px}
.hlist li::before{content:"";position:absolute;left:-3px;top:19px;width:5px;height:5px;border-radius:50%;
  background:var(--line-2)}
.hlist li:first-child::before{background:var(--brand);width:7px;height:7px;left:-4px}
.hlist .hm{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--brand-lit);padding-top:4px}
.hlist p{margin:0;font-size:14.5px;color:var(--fg-2);line-height:1.65}
@media(max-width:760px){
  .hyear{grid-template-columns:1fr;gap:16px}
  .hyear-k{position:static}
  .hyear-k span{font-size:30px}
  .hlist li{grid-template-columns:52px 1fr;padding-left:18px}
}

/* ============ RELEASE TIMELINE ============ */
.tlw{overflow-x:auto;border:1px solid var(--line);background:var(--ground)}
.tl{min-width:760px;font-size:12.5px}
.tlr{display:grid;grid-template-columns:170px repeat(6,1fr);border-top:1px solid var(--line)}
.tlr:first-child{border-top:0}
.tlh{background:var(--surface);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--mute);
  text-transform:uppercase}
.tlc{padding:10px 12px;border-left:1px solid var(--line);display:flex;align-items:center}
.tlc:first-child{border-left:0;display:block;padding-block:12px;color:var(--fg);font-weight:500}
.tlc:first-child em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute);
  letter-spacing:.05em;margin-top:3px}
.bar{width:100%;padding:5px 9px;font-size:11.5px;line-height:1.4;border:1px solid var(--line-2);color:var(--fg-2)}
.bar.done{background:rgba(29,158,117,.14);border-color:rgba(29,158,117,.55);color:var(--ok)}
.bar.done::before{content:"✓ "}
.bar.fix{background:rgba(107,31,31,.35);border-color:var(--maroon);color:#f4f2f0}
.bar:not(.done):not(.fix){border-style:dashed}
.legend{display:flex;gap:8px;margin:14px 0 0}.legend .bar{width:auto;font-size:11px}

/* ============ NEWS ============ */
.news{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.news article{display:grid;grid-template-columns:116px 1fr auto;gap:20px;padding:22px 4px;
  border-bottom:1px solid var(--line);align-items:baseline}
.news .dt{font-family:var(--mono);font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.news h3{font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em}
.news p{margin:7px 0 0;font-size:13.5px;color:var(--mute);max-width:70ch}
.news .kind{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--brand-lit)}
@media(max-width:700px){.news article{grid-template-columns:1fr;gap:7px}}

/* ============ DEMOS ============ */
.demos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.demos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.demos{grid-template-columns:1fr}}
.demo{border:1px solid var(--line);background:var(--ground);padding:18px;display:flex;flex-direction:column;gap:10px}
.demo .tags{display:flex;gap:5px;flex-wrap:wrap}
.demo b{font-size:14.5px;font-weight:600}
.demo span{font-size:12.5px;color:var(--mute)}

/* ============ FORM ============ */
.form{display:grid;gap:16px;max-width:640px}
.field{display:grid;gap:7px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field label .req{color:var(--brand-lit)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-2);
  padding:11px 13px;font-size:14px;outline:none;transition:.16s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-lit)}
.field textarea{min-height:130px;resize:vertical;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);
  border:1px solid var(--line);padding:14px;background:var(--surface)}
.agree input{width:16px;height:16px;flex:none;margin-top:3px;accent-color:var(--brand)}
.agree a{color:var(--brand-lit);border-bottom:1px solid currentColor}
.formnote{font-size:12px;color:var(--mute)}

/* ============ FOOTER ============ */
.foot{border-top:1px solid var(--line);background:var(--ground);padding-block:44px 30px;margin-top:0}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:28px}
@media(max-width:880px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-lit);
  margin:0 0 12px;font-weight:400}
.foot a,.foot li{font-size:13px;color:var(--fg-2)}
.foot ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.foot .logo{height:26px;width:auto;margin-bottom:16px}
.corp{font-size:12px;color:var(--mute);line-height:1.9}
.corp b{color:var(--fg-2);font-weight:500}
.foot-bot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:16px;
  flex-wrap:wrap;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute)}
.foot-bot .links{display:flex;gap:16px;flex-wrap:wrap}
.foot-bot .links a:hover{color:var(--fg)}
</style>

function v404(){
  return head('404',L3('페이지를 찾을 수 없습니다','Page not found','ページが見つかりません'))+
    sec(`<a class="btn ghost" href="#/">${esc(t(L3('홈으로','Back home','ホームへ')))}</a>`);
}

/* ================= ROUTER ================= */
function parse(){
  const raw=(location.hash||'#/').slice(1);
  const [path,qs]=raw.split('?');
  const seg=path.split('/').filter(Boolean);
  return {seg,q:new URLSearchParams(qs||'')};
}
function render(){
  const {seg,q}=parse();
  let body,active='';
  if(seg.length===0){body=vHome();}
  else if(seg[0]==='about'){active='about';
    body=seg[1]==='strategy'?vStrategy():seg[1]==='history'?vHistory():seg[1]==='download'?vDownload():
         seg[1]==='partners'?vPartners():seg[1]==='location'?vLocation():vAbout();}
  else if(seg[0]==='ip'){active='ip';
    body=!seg[1]?vIpList():seg[1]==='timeline'?vTimeline():vIpDetail(seg[1]);}
  else if(seg[0]==='playtoon'){active='playtoon';
    body=seg[1]==='demo'?vDemo():seg[1]==='maker'?vMaker():seg[1]==='tech'?vTech():vPlaytoon();}
  else if(seg[0]==='playbook'){active='playbook';
    body=seg[1]==='reference'?vPbRef():vPlaybook();}
  else if(seg[0]==='business'){active='business';body=vBusiness();}
  else if(seg[0]==='news'){active='news';body=vNews();}
  else if(seg[0]==='career'){active='career';body=vCareer();}
  else if(seg[0]==='contact'){active='contact';body=vContact(q.get('type')||'ip');}
  else if(seg[0]==='privacy'){body=vPrivacy();}
  else{body=v404();}
  app.innerHTML=navHTML(active)+`<main>${body}</main>`+footHTML();
  bind();
}
function bind(){
  const b=document.getElementById('burger');
  if(b)b.onclick=()=>{drawerOpen=!drawerOpen;document.getElementById('drawer').classList.toggle('open',drawerOpen);};
  document.querySelectorAll('.lang button').forEach(el=>el.onclick=()=>{
    L=el.dataset.lang;document.documentElement.setAttribute('data-lang',L);
    document.documentElement.setAttribute('lang',L==='ja'?'ja':L);
    try{localStorage.setItem('ss-lang',L)}catch(e){}
    const y=window.scrollY;render();window.scrollTo(0,y);});
  document.querySelectorAll('.fchips button').forEach(el=>el.onclick=()=>{
    F[el.dataset.f]=el.dataset.v;const y=window.scrollY;render();window.scrollTo(0,y);});
  const q=document.getElementById('q');
  if(q){q.oninput=()=>{F.q=q.value;const y=window.scrollY;render();window.scrollTo(0,y);
    const nq=document.getElementById('q');if(nq){nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);}};}
  const mb=document.getElementById('mapbox');
  if(mb){
    /* 지도를 띄울 수 없는 환경(CSP 차단 · 네트워크 불가)을 먼저 확인하고
       그런 경우에만 대체 안내를 노출합니다. */
    let settled=false;
    const fail=()=>{if(!settled){settled=true;mb.classList.add('blocked');}};
    const probe=new Image();
    probe.referrerPolicy='no-referrer';
    probe.onload=()=>{settled=true;};
    probe.onerror=fail;
    probe.src='https://maps.google.com/favicon.ico?'+Date.now();
    setTimeout(fail,2500);
  }
  const f=document.getElementById('cform');
  if(f)f.onsubmit=e=>{e.preventDefault();
    const g=id=>document.getElementById(id).value;
    const ty=CTYPES.find(c=>c[0]===g('ctype'));
    const subj=`[${t(ty[1])}] ${g('cname')}${g('ccorp')?' / '+g('ccorp'):''}`;
    const body=[`${t(L3('문의 유형','Enquiry type'))}: ${t(ty[1])}`,`${t(L3('성함','Name'))}: ${g('cname')}`,
      `${t(L3('회사 · 단체','Company'))}: ${g('ccorp')}`,`${t(L3('이메일','Email'))}: ${g('cmail')}`,
      `${t(L3('연락처','Phone'))}: ${g('ctel')}`,'','---','',g('cmsg')].join('\n');
    location.href=`mailto:${MAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;};
}
window.addEventListener('hashchange',()=>{drawerOpen=false;render();window.scrollTo(0,0);});
try{L=localStorage.getItem('ss-lang')||'ko'}catch(e){}
if(!['ko','en','ja'].includes(L))L='ko';
document.documentElement.setAttribute('data-lang',L);
document.documentElement.setAttribute('lang',L==='ja'?'ja':L);
render();
</script>
